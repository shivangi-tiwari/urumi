# Default values — override in values-local.yaml / values-prod.yaml
# Only hello exists in Phase 0; later phases add store, gateway, etc.
hello:
  replicaCount: 2
  image:
    # nginx-unprivileged runs as non-root (uid 101) and listens on 8080,
    # so the container satisfies the "run as non-root" rule without extra config.
    repository: nginxinc/nginx-unprivileged
    tag: stable-alpine
    pullPolicy: IfNotPresent
  host: hello.127.0.0.1.nip.io
  servicePort: 80
  containerPort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
