apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-everything
  labels:
    app: mcp-everything
spec:
  podSelector:
    matchLabels:
      app: mcp-everything
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
