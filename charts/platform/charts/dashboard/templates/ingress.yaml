{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.gatewayService }}
                port:
                  number: {{ .Values.ingress.gatewayPort }}
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.gatewayService }}
                port:
                  number: {{ .Values.ingress.gatewayPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: {{ .Values.service.port }}
{{- end }}
