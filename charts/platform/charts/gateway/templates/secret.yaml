apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authSecretName }}
type: Opaque
stringData:
  admin-email: {{ required "gateway.adminEmail must be set in an ignored secrets values file" .Values.adminEmail | quote }}
  admin-password: {{ required "gateway.adminPassword must be set in an ignored secrets values file" .Values.adminPassword | quote }}
  session-secret: {{ required "gateway.sessionSecret must be set in an ignored secrets values file" .Values.sessionSecret | quote }}
