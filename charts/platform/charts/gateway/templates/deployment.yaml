apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:$(POSTGRES_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName }}
                  key: admin-email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName }}
                  key: admin-password
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName }}
                  key: session-secret
            - name: CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName }}
                  key: credentials-key
            - name: CHAT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName }}
                  key: chat-jwt-secret
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecretName }}
                  key: llm-api-key
            - name: LLM_BASE_URL
              value: {{ .Values.chat.baseURL | quote }}
            - name: LLM_MODEL
              value: {{ .Values.chat.model | quote }}
            - name: CHAT_TOOL_MODE
              value: {{ .Values.chat.toolMode | default "search" | quote }}
            - name: GATEWAY_MCP_URL
              value: {{ .Values.chat.mcpUrl | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.auth.cookieSecure | quote }}
            - name: SSRF_ALLOWED_HOSTS
              value: {{ .Values.ssrfAllowedHosts | quote }}
            - name: ADMIN_ONLY_TOOLS
              value: {{ .Values.adminOnlyTools | quote }}
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.rateLimitPerMinute | default 60 | quote }}
            - name: CHAT_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.chatRateLimitPerMinute | default 10 | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
