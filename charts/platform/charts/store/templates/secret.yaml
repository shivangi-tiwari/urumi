apiVersion: v1
kind: Secret
metadata:
  name: store-database
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ required "store.database.rootPassword must be set in an ignored secrets values file" .Values.database.rootPassword | b64enc | quote }}
  database-password: {{ required "store.database.password must be set in an ignored secrets values file" .Values.database.password | b64enc | quote }}
  wordpress-admin-password: {{ required "store.wordpress.adminPassword must be set in an ignored secrets values file" .Values.wordpress.adminPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-api
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data: {}
