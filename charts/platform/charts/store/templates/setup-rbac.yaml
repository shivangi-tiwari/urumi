apiVersion: v1
kind: ServiceAccount
metadata:
  name: wordpress-setup
  labels:
    {{- include "store.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wordpress-setup
  labels:
    {{- include "store.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - woo-api
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wordpress-setup
  labels:
    {{- include "store.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: wordpress-setup
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wordpress-setup
