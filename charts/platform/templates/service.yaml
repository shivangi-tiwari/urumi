apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: urumi
  labels:
    app: hello
    {{- include "platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: hello
  ports:
    - name: http
      port: {{ .Values.hello.servicePort }}
      targetPort: http
      protocol: TCP
