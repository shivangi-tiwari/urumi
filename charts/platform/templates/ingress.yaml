apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: urumi
  labels:
    app: hello
  {{- with .Values.hello.ingress }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- with .Values.hello.ingress }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.hello.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: {{ .Values.hello.servicePort }}
