apiVersion: v2
name: platform
description: Urumi MCP Gateway - umbrella chart
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: store
    version: 0.1.0
    repository: file://charts/store
    condition: store.enabled
  - name: mcp-woo
    version: 0.1.0
    repository: file://charts/mcp-woo
    condition: mcp-woo.enabled
  - name: mcp-notes
    version: 0.1.0
    repository: file://charts/mcp-notes
    condition: mcp-notes.enabled
  - name: postgres
    version: 0.1.0
    repository: file://charts/postgres
    condition: postgres.enabled
  - name: gateway
    version: 0.1.0
    repository: file://charts/gateway
    condition: gateway.enabled
